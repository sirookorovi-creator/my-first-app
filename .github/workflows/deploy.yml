name: Deploy VOXBRIDGE (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VOXBRIDGE_D1_DATABASE_ID: ${{ vars.VOXBRIDGE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare setup
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Cloudflare account ID and API token are required as repository secrets."
            exit 1
          fi
          if ! [[ "$VOXBRIDGE_D1_DATABASE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::Set VOXBRIDGE_D1_DATABASE_ID in repository variables (D1 database UUID)."
            exit 1
          fi

      - name: Install dependencies and run tests
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Configure D1 database binding in temporary workspace
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const file = "wrangler.jsonc";
            const config = JSON.parse(fs.readFileSync(file,"utf8"));
            const db = config.d1_databases?.find(x => x.binding === "DB");
            if (!db) throw Error("D1 binding DB missing");
            db.database_id = process.env.VOXBRIDGE_D1_DATABASE_ID;
            fs.writeFileSync(file, JSON.stringify(config,null,2)+"\\n");
          '

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply voxbridge-db --remote

      - name: Deploy Worker and static site
        run: npx wrangler deploy
