name: Deploy VOXBRIDGE (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare setup
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Cloudflare account ID and API token are required as repository secrets."
            exit 1
          fi

      - name: Install dependencies and run tests
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply voxbridge-db --remote

      - name: Deploy Worker and static site
        run: npx wrangler deploy
